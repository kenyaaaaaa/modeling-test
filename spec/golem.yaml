# Clock golem — numbers read from reference/turnaround_sheet.png
# (tools/ref_mask.py, tools/ref_grid.py).  Metres, Blender axes:
# X = character's left, -Y = front, Z = up.

height: 3.5          # ground to finial tip ("約3.5m" on the sheet)
width: 3.67          # arm to arm, front view
depth: 1.57          # side view

# Triangle budget for the game mesh (Godot, PC; 2026-10-19 raised to 100k).
# Godot generates the distance LODs on import.
budget:
  total: 100000
  case_and_clock: 28000
  hourglass: 11000
  stone_plates: 22000
  rock_body_limbs: 20000
  gears_and_weights: 12000
  back_mechanism: 7000

# Palette sampled with k-means from the front view.
palette:
  stone:        "#e5dab7"
  stone_light:  "#f4efdd"
  stone_shadow: "#af9f7b"
  brass:        "#d6be86"
  brass_mid:    "#918160"
  brass_shadow: "#635030"
  rock_light:   "#695c52"
  rock:         "#3f383a"
  rock_dark:    "#2f2722"
  outline:      "#130e0d"
  sand_dark:    "#2c2838"
  sand_glow:    "#fbf6b4"
  glass:        "#d8d2b0"
  clock_face:   "#dacb9d"

# Blockout acceptance: silhouette IoU against the sheet, per view.
blockout_iou_target: 0.85
