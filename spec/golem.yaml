# Clock golem — numbers read from reference/turnaround_sheet.png
# (tools/ref_mask.py, tools/ref_grid.py).  Metres, Blender axes:
# X = character's left, -Y = front, Z = up.

height: 3.5          # ground to finial tip ("約3.5m" on the sheet)
width: 3.67          # arm to arm, front view
depth: 1.57          # side view

# Triangle counts are reported per group; no cap (2026-10-19: 30k -> 100k ->
# 200k -> no limit, the user asked not to reduce).  Godot makes the distance
# LODs on import.

# Palette sampled with k-means from the front view.
palette:
  stone:        "#e5dab7"
  stone_light:  "#f4efdd"
  stone_shadow: "#af9f7b"
  brass:        "#d6be86"
  brass_mid:    "#918160"
  brass_shadow: "#635030"
  rock_light:   "#7d6858"   # wrist pieces; the sheet shows #5a4b44 in shade, lighter in light
  rock:         "#5f5659"   # lit rock on the concept is ~#5a5355 (purple-grey); toon bands darken it
  rock_dark:    "#3d322e"
  outline:      "#130e0d"
  sand_dark:    "#2c2838"
  sand_glow:    "#fbf6b4"
  glass:        "#d8d2b0"
  clock_face:   "#dacb9d"

# Stone and rock layout (user picked seed 1 of review/stone/variants.png, 2026-10-19).
stone_seed: 1

# Blockout acceptance: silhouette IoU against the sheet, per view.
blockout_iou_target: 0.85
# Detail stages: 0.84.  The side view draws the back thinner than the back
# view does; the back view's frame and wheel housing win (docs/PLAN.md).
detail_iou_target: 0.84
